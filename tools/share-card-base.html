<!doctype html><meta charset="utf-8">
<!-- Share card pieces (design C, chosen by Austin on November 25, 2026). Drawn once with headless Chrome by tools/make_share_assets.sh;
     Hugo then prints each post's title on the base when the site is built (layouts/_partials/sharecard.html). -->
<style>@font-face{font-family:"Source Serif 4";src:url("fonts/source-serif-4-latin-wght-normal.woff2") format("woff2");font-weight:200 900}
@font-face{font-family:"Source Serif 4";src:url("fonts/source-serif-4-latin-wght-italic.woff2") format("woff2");font-weight:200 900;font-style:italic}
@font-face{font-family:"Public Sans";src:url("fonts/public-sans-latin-wght-normal.woff2") format("woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;background:#f7f1e5;color:#241f1a;position:relative;overflow:hidden}
.logo-f1{display:inline-block;font-family:"Source Serif 4",Georgia,serif;font-weight:400;font-size:40px;line-height:1;white-space:nowrap;color:#241f1a;padding-bottom:.42em}
.logo-f1 i{font-style:italic;font-weight:400}.logo-mid{position:relative;display:inline-block;line-height:1}.logo-bl{display:inline-block;width:0;height:0}
.logo-prof{font-weight:700;color:#8c1d18}.logo-yr{position:absolute;top:1em;right:.12em;font-size:.26em;line-height:1;white-space:nowrap}
.logo-yr span{font:500 1em "Public Sans",sans-serif;letter-spacing:.3em;color:#7d7166}
.foot{position:absolute;left:80px;right:80px;bottom:44px;display:flex;justify-content:space-between;align-items:center}
.url{font:600 22px "Public Sans";letter-spacing:.1em;text-transform:uppercase}
.kick{position:absolute;left:0;top:0;font:700 22px/30px "Public Sans";letter-spacing:.1em;text-transform:uppercase;color:#8c1d18;white-space:nowrap}</style>
<div class="foot"><span class="logo-f1">Immig<span class="logo-mid"><span class="logo-bl"></span>ration<span class="logo-prof">Prof</span> <i>Blo</i><span class="logo-yr"><span>SINCE 2005</span></span></span><i class="logo-g">g</i></span><span class="url">immprof.com</span></div>
<script>
    (function(){function place(){document.querySelectorAll('.logo-f1').forEach(function(w){
      var m=w.querySelector('.logo-mid'),y=m.querySelector('.logo-yr'),t=y.firstElementChild,g=w.querySelector('.logo-g');
      var size=parseFloat(getComputedStyle(w).fontSize),GAP=size*.16;
      var base=m.querySelector('.logo-bl').getBoundingClientRect().bottom,top=m.getBoundingClientRect().top;
      var cs=getComputedStyle(t),c=document.createElement('canvas').getContext('2d');
      c.font=cs.fontStyle+' '+cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
      var mk=document.createElement('span');mk.style.cssText='display:inline-block;width:0;height:0';t.appendChild(mk);
      y.style.top=(base-top)+'px';
      var capTop=mk.getBoundingClientRect().bottom-c.measureText('S').actualBoundingBoxAscent;
      y.style.top=(base-top-(capTop-base-GAP))+'px';mk.remove();
      var gs=getComputedStyle(g);c.font=gs.fontStyle+' '+gs.fontWeight+' '+gs.fontSize+' '+gs.fontFamily;
      var gLeft=g.getBoundingClientRect().left-c.measureText('g').actualBoundingBoxLeft,trail=parseFloat(cs.letterSpacing)||0;
      y.style.right='0px';var yr=y.getBoundingClientRect().right-trail;y.style.right=(yr-(gLeft-GAP))+'px';
    });}
    if(document.fonts&&document.fonts.ready){document.fonts.ready.then(place);}else{window.addEventListener('load',place);}
    window.addEventListener('resize',place);})();
    </script>
